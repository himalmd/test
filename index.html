<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #121212;
        color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      .dashboard {
        display: flex;
        align-items: center;
        background-color: #1e1e1e;
        padding: 40px 60px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        gap: 30px;
      }

      .time {
        font-size: 160px;
        font-weight: 200;
        line-height: 1;
        letter-spacing: -4px;
        margin-right: 10px;
      }

      .details {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        padding-right: 30px;
        border-right: 1px solid #333;
      }

      .am {
        font-size: 22px;
        font-weight: 600;
        text-transform: uppercase;
        color: #aaaaaa;
        letter-spacing: 1px;
        margin-bottom: 5px;
      }

      .day {
        font-size: 32px;
        font-weight: 500;
      }

      .date {
        font-size: 28px;
        font-weight: 300;
        color: #bbbbbb;
      }

      .weather {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-left: 10px;
      }

      .weather svg {
        width: 70px;
        height: 70px;
        margin-bottom: 10px;
      }

      .temp {
        font-size: 48px;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <div class="time">8:03</div>
      <div class="details">
        <div class="am">AM</div>
        <div class="day">Tuesday</div>
        <div class="date">March 4</div>
      </div>
      <div class="weather">
        <!-- Partly cloudy SVG -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="42" cy="22" r="10" fill="#FFD700" />
          <path
            d="M44 34a14 14 0 0 0-26.5-6A10 10 0 1 0 18 48h26a14 14 0 0 0 0-28z"
            fill="#E0E0E0"
          />
        </svg>
        <div class="temp">17&deg;</div>
      </div>
    </div>
  </body>
</html>
